{% extends 'base.html' %} {% block title %}Register — TaskFlow{% endblock %} {%
block extra_head %}
<style>
  .auth-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    z-index: 1;
  }
  .auth-box {
    width: 100%;
    max-width: 440px;
    padding: 48px 44px;
    border-radius: 24px;
    background: linear-gradient(
      145deg,
      rgba(13, 31, 86, 0.85),
      rgba(6, 15, 46, 0.9)
    );
    border: 1px solid var(--border);
    backdrop-filter: blur(30px);
    box-shadow: 0 32px 80px rgba(2, 8, 24, 0.6);
    animation: fadeUp 0.5s ease;
  }
  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(24px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  .auth-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 36px;
  }
  .logo-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, #2563eb, #4f8fff);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
  }
  .logo-text {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .logo-text span {
    color: var(--accent);
  }
  h2 {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 32px;
  }
  .glow-line {
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    margin-bottom: 32px;
  }
  .auth-footer {
    margin-top: 24px;
    text-align: center;
    font-size: 0.875rem;
    color: var(--text-muted);
  }
  .auth-footer a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .auth-footer a:hover {
    text-decoration: underline;
  }
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
  }
  .orb-1 {
    width: 400px;
    height: 400px;
    background: rgba(15, 36, 112, 0.5);
    top: -100px;
    right: -100px;
  }
  .orb-2 {
    width: 300px;
    height: 300px;
    background: rgba(37, 99, 235, 0.15);
    bottom: -50px;
    left: -50px;
  }
</style>
{% endblock %} {% block content %}
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo-icon">✦</div>
      <div class="logo-text">Task<span>Flow</span></div>
    </div>
    <h2>Create account</h2>
    <p class="subtitle">Start managing your tasks today</p>
    <div class="glow-line"></div>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label>Username</label>
        <input
          type="text"
          name="username"
          placeholder="Choose a username"
          required
          autofocus
        />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          name="email"
          placeholder="your@email.com"
          required
        />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          name="password"
          placeholder="Create a password"
          required
        />
      </div>
      <button
        type="submit"
        class="btn btn-primary"
        style="width: 100%; justify-content: center; padding: 14px"
      >
        Create Account →
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
